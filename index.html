<style>
/* Tablero nocturno: menú lateral con íconos + panel de tarjetas oscuras. Un color fijo por producto en todos los gráficos. */
:root{
  --bg:#0E1320; --surface:#171E31; --surface2:#232C47; --ink:#E8ECF5; --muted:#A3AEC6; --line:#2A3350;
  --accent:#FFB020; --accent-ink:#0E1320; --glp:#3EC5FF; --pink:#FF5C8A; --violet:#C9A7FF;
  --ok:#4ADE80; --warn:#FFC857; --bad:#FF7A93; --soft:#1D2540;
  --f-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --f-body:"Sora", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, ui-monospace, monospace;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:17px;font-weight:700}
h2{font-size:24px;font-weight:700}
h3{font-size:16px;font-weight:600}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--glp)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.side{background:var(--bg);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 8px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;flex:none}
.brand small{color:var(--muted);font-size:12px;display:block}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a svg{flex:none}
.nav a span.t{flex:1}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.on{background:var(--surface2);color:var(--ink)}
.nav a.on svg{stroke:var(--accent)}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:14px 12px 4px;opacity:.8}
.badge{font-size:11px;font-family:var(--f-mono);background:var(--pink);color:#0E1320;font-weight:700;border-radius:99px;padding:0 7px}
.main{padding:26px clamp(16px,3vw,34px) 60px;display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.status{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:14px;padding:12px;margin-top:auto}
.status b{color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g2u{grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

.grow{flex:999 1 520px;min-width:0}
.side-col{flex:1 1 300px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}

.btn{border:1px solid var(--line);background:transparent;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink)}

.kv dt{color:var(--muted)} .kv dd{margin:0}

.opt .amt{flex:0 0 auto;text-align:right}

.pcard{background:var(--soft);border-radius:14px;border-top:3px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;flex-direction:column;gap:4px}
.pbar{position:relative;height:26px;border-radius:8px;background:var(--line);overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;opacity:.9}
.pbar b{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.track i{display:block;height:8px;border-radius:99px}

.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--soft)}

.checks div::before{content:"• ";font-weight:700}
.checks .ok{color:var(--ok)} .checks .warn{color:var(--warn)} .checks .bad{color:var(--bad)}

.modal-bg{position:fixed;inset:0;background:rgba(3,6,14,.72);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}

.portal{border-top:3px solid var(--violet)}
.portal.glp{border-top-color:var(--glp)}

.copyline{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:10px;padding:7px 11px;font-size:13.5px}

  .side.open{transform:none}

<script type="text/plain" id="gsCode">
/**
 * Nube propia para "Control de Compras de Combustible".
 * Guarda los datos y los comprobantes en TU Google Drive, carpeta "ControlCombustible-Nube".
 * Gratis: corre en tu cuenta de Google (Apps Script). No hay terceros ni pagos.
 *
 * 1) Cambia CLAVE por una frase larga que solo tú conozcas (mínimo 16 caracteres).
 * 2) Implementar > Nueva implementación > Tipo: Aplicación web
 *    Ejecutar como: Yo   ·   Quién tiene acceso: Cualquier usuario
 * 3) Copia la URL que termina en /exec y pégala en la app junto con la CLAVE.
 */
const CLAVE = 'CAMBIA-ESTA-CLAVE-POR-UNA-FRASE-LARGA';
const CARPETA = 'ControlCombustible-Nube';
const ARCHIVO = 'control-combustible-datos.json';

function doGet(e) { return responder_(manejar_((e && e.parameter) || {})); }
function doPost(e) {
  let p = {};
  try { p = JSON.parse(e.postData.contents); } catch (err) { return responder_({ ok: false, error: 'formato' }); }
  return responder_(manejar_(p));
}

function manejar_(p) {
  if (!p.clave || p.clave !== CLAVE || CLAVE.indexOf('CAMBIA-ESTA-CLAVE') === 0) return { ok: false, error: 'clave' };
  const lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    const props = PropertiesService.getScriptProperties();
    switch (p.accion) {
      case 'ping':
        return { ok: true, carpeta: carpeta_().getName(), guardado: props.getProperty('guardado') };
      case 'meta':
        return { ok: true, guardado: props.getProperty('guardado') };
      case 'leer': {
        const f = archivo_();
        return { ok: true, datos: f ? JSON.parse(f.getBlob().getDataAsString('UTF-8')) : null, guardado: props.getProperty('guardado') };
      }
      case 'guardar': {
        const actual = props.getProperty('guardado');
        if (!p.forzar && actual && p.base !== actual) return { ok: false, error: 'conflicto', guardado: actual };
        if (!p.datos || p.datos.app !== 'control-combustible') return { ok: false, error: 'datos' };
        const texto = JSON.stringify(p.datos);
        const f = archivo_();
        if (f) f.setContent(texto); else carpeta_().createFile(ARCHIVO, texto, 'application/json');
        props.setProperty('guardado', p.datos.guardado);
        return { ok: true, guardado: p.datos.guardado };
      }
      case 'listarAdjuntos': {
        const ids = [];
        const it = adjuntos_().getFiles();
        while (it.hasNext()) ids.push(it.next().getName().split('__')[0]);
        return { ok: true, ids: ids };
      }
      case 'subirAdjunto': {
        if (!/^f_[a-z0-9]+$/i.test(p.id || '')) return { ok: false, error: 'id' };
        const dir = adjuntos_();
        const nombre = p.id + '__' + String(p.nombre || 'archivo').replace(/[\\/:*?"<>|]/g, '_');
        if (dir.getFilesByName(nombre).hasNext()) return { ok: true, existe: true };
        dir.createFile(Utilities.newBlob(Utilities.base64Decode(p.data), p.tipo || 'application/octet-stream', nombre));
        return { ok: true };
      }
      case 'bajarAdjunto': {
        const it = adjuntos_().getFiles();
        while (it.hasNext()) {
          const f = it.next();
          if (f.getName().indexOf(p.id + '__') === 0) {
            const b = f.getBlob();
            return { ok: true, nombre: f.getName().slice(p.id.length + 2), tipo: b.getContentType(), data: Utilities.base64Encode(b.getBytes()) };
          }
        }
        return { ok: false, error: 'no-existe' };
      }
      default:
        return { ok: false, error: 'accion' };
    }
  } catch (err) {
    return { ok: false, error: String(err) };
  } finally {
    lock.releaseLock();
  }
}

function carpeta_() {
  const it = DriveApp.getFoldersByName(CARPETA);
  return it.hasNext() ? it.next() : DriveApp.createFolder(CARPETA);
}
function adjuntos_() {
  const c = carpeta_(), it = c.getFoldersByName('comprobantes');
  return it.hasNext() ? it.next() : c.createFolder('comprobantes');
}
function archivo_() {
  const it = carpeta_().getFilesByName(ARCHIVO);
  return it.hasNext() ? it.next() : null;
}
function responder_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
/** Ejecuta esta función una vez desde el editor para dar permisos de Drive. */
function autorizar() { carpeta_(); adjuntos_(); Logger.log('Listo: carpeta ' + CARPETA); }
</script>

<script>
"use strict";
/* ============ Estado ============ */
const S = { empresa:{}, portales:{}, proveedores:[], compras:[], depositos:[], facturas:[], unidades:[], ventas:[] };
let idb = null, dirHandle = null, fileNeedsPerm = false, lastBackup = "", lastFileSave = "", localSaved = "", syncing = false;
let modalOpen = false, pendingRender = false;
const loaded = {};

const DEF_EMP = { usuarioScop:"1678500", registroGLP:"176748-038-190824", usuarioScopGLP:"17674800" };
const PRODUCTOS_LIQ = ["Gasohol Premium","Gasohol Regular","Diésel B5 S-50 UV"];
const PRODUCTOS_GLP = ["GLP granel"];  /* se compra en kg */
const ESTADOS = ["Cotizada","Depositada","Facturada","Recibida","Anulada"];
const BANCOS = ["BCP","BBVA","Interbank","Scotiabank","Banco de la Nación","BanBif","Pichincha","Caja Huancayo","Otro"];

/* ============ Utilidades ============ */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g,"")); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const money = (n,cur="PEN") => (cur==="USD"?"US$ ":"S/ ") + num(n).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const qty = n => num(n).toLocaleString("es-PE",{maximumFractionDigits:3});
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fdate = s => { if(!s) return "—"; const [y,m,d]=String(s).slice(0,10).split("-"); return d&&m&&y ? `${d}/${m}/${y}` : esc(s); };
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 864e5);

/* ============ Cálculos ============ */
const facTotal=f=> f.incluyePercepcion ? num(f.total) : num(f.total)+num(f.percepcion);
/* GLP: se compra en kilogramos y se vende en galones. Factor configurable en Mi empresa. */
const DEF_GLP_FACTOR=2.04;
const glpF=()=>{ const v=num(S.empresa.glpFactor); return v>0?v:DEF_GLP_FACTOR; };
const isGlp=n=>/glp/.test(norm(n));
const unitOf=(prod,u)=> u || (isGlp(prod)?"kg":"gal");
const toKg=(q,u)=> u==="kg"?num(q):num(q)*glpF();
const toGal=(q,u)=> u==="kg"?num(q)/glpF():num(q);
/* cantidad en la unidad de presentación: líquidos en gal; GLP en kg (o gal si se elige) */
function qDisp(prod,q,u,glpU){ if(!isGlp(prod)) return {q:toGal(q,u), u:"gal"}; const t=glpU||"kg"; return {q:t==="kg"?toKg(q,u):toGal(q,u), u:t}; }
/* precios: se guardan con IGV; percepción aparte (del proveedor) */
/* Precios referenciales (siempre CON impuestos, 4 decimales):
   - Líquidos: el precio del proveedor ya trae sus impuestos; la percepción del proveedor se suma aparte para el depósito.
   - GLP: con impuestos = sin impuestos × 1.18 (IGV) × (1 + percepción); la percepción ya va dentro del precio. */
const money4 = n => "S/ " + num(n).toLocaleString("es-PE",{minimumFractionDigits:4,maximumFractionDigits:4});
const glpSinImp=(p,pct)=>num(p)/(1.18*(1+num(pct)/100));
const glpConImp=(v,pct)=>num(v)*1.18*(1+num(pct)/100);
const precioSinImp=p=>num(p)/1.18;
const precioConPer=(p,pct)=>num(p)*(1+num(pct)/100);
/* percepción de una cotización: en líquidos se suma; en GLP ya está incluida en el precio */
function percCot(lines,pct){ let add=0, incl=0; lines.forEach(l=>{ const imp=num(l.importe); if(isGlp(l.producto)) incl+=imp-imp/(1+num(pct)/100); else add+=imp*num(pct)/100; }); return {add:r2(add), incl:r2(incl)}; }
function saldoProveedor(pid){
  const p = prov(pid) || {};
  const dep = S.depositos.filter(d=>d.proveedorId===pid).reduce((a,d)=>a+num(d.monto),0);
  const fac = S.facturas.filter(f=>f.proveedorId===pid).reduce((a,f)=>a+facTotal(f),0);
  return { inicial:num(p.saldoInicial), depositos:dep, facturado:fac, saldo:r2(num(p.saldoInicial)+dep-fac) };
}
function depositosCompra(cid){ return S.depositos.filter(d=>d.compraId===cid).reduce((a,d)=>a+num(d.monto),0); }
function facturasCompra(cid){ return S.facturas.filter(f=>f.compraId===cid); }

/* ============ Base de datos local (IndexedDB en este equipo) ============ */
const COLS=["proveedores","compras","depositos","facturas","unidades","ventas"];
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function openIDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open("control-combustible",1);
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); if(!d.objectStoreNames.contains("files")) d.createObjectStore("files"); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbReq(store,mode,fn){ return new Promise((res,rej)=>{ const tx=idb.transaction(store,mode); const st=tx.objectStore(store); let out; const rq=fn(st); if(rq) rq.onsuccess=()=>{out=rq.result;}; tx.oncomplete=()=>res(out); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
const idbGet=(st,k)=>idbReq(st,"readonly",o=>o.get(k));
const idbPut=(st,k,v)=>idbReq(st,"readwrite",o=>o.put(v,k));
const idbDel=(st,k)=>idbReq(st,"readwrite",o=>o.delete(k));
const idbKeys=st=>idbReq(st,"readonly",o=>o.getAllKeys());
function snapshot(){ return {app:"control-combustible", version:1, guardado:new Date().toISOString(), empresa:S.empresa, portales:S.portales, proveedores:S.proveedores, compras:S.compras, depositos:S.depositos, facturas:S.facturas, unidades:S.unidades, ventas:S.ventas}; }
let saveTimer=null;
async function persist(){
  const snap=snapshot(); localSaved=snap.guardado;
  await idbPut("kv","data",snap); await idbPut("kv","localSaved",localSaved);
  clearTimeout(saveTimer); saveTimer=setTimeout(writeDataFile,800);
  scheduleCloud();
  paintStatus();
}

    if(col==="config"){ S[id]={...data}; if(id==="empresa") paintBrand(); }
    else { const nid=id||genId(); const i=S[col].findIndex(x=>x.id===nid); const row={...data, id:nid}; if(i>=0) S[col][i]=row; else S[col].push(row); id=nid; }
    await persist(); requestRender(); return id;
  }catch(e){ toast("No se pudo guardar en este equipo: "+(e&&e.message||e)); throw e; }

async function remove(col,id){ S[col]=S[col].filter(x=>x.id!==id); await persist(); requestRender(); }

/* Carpeta de datos sincronizada (Chrome/Edge): datos + comprobantes, ideal dentro de Google Drive u OneDrive */
const DATA_NAME="control-combustible-datos.json", ADJ_DIR="comprobantes";
async function hasPerm(){ try{ return !!dirHandle && (await dirHandle.queryPermission({mode:"readwrite"}))==="granted"; }catch(_){ return false; } }
async function readFolderData(){ try{ const fh=await dirHandle.getFileHandle(DATA_NAME); return JSON.parse(await (await fh.getFile()).text()); }catch(_){ return null; } }
const adjDir=()=>dirHandle.getDirectoryHandle(ADJ_DIR,{create:true});
const adjName=(id,name)=>id+"__"+String(name||"archivo").replace(/[\\/:*?"<>|]/g,"_");
async function syncAttachmentsOut(){
  const d=await adjDir(); const have=new Set(); for await (const [n] of d.entries()) have.add(n.split("__")[0]);
  for(const id of await idbKeys("files")){ if(have.has(id)) continue; const f=await idbGet("files",id); if(!f) continue;
    const fh=await d.getFileHandle(adjName(id,f.name),{create:true}); const w=await fh.createWritable(); await w.write(f.blob); await w.close(); }
}
async function syncAttachmentsIn(){
  const d=await adjDir(); const have=new Set(await idbKeys("files"));
  for await (const [n,h] of d.entries()){ if(h.kind!=="file") continue; const id=n.split("__")[0]; if(have.has(id)) continue;
    const file=await h.getFile(); await idbPut("files",id,{name:n.slice(id.length+2), type:file.type, blob:file, fecha:new Date().toISOString()}); }
}
async function folderFile(id){ try{ if(!(await hasPerm())) return null; const d=await adjDir(); for await (const [n,h] of d.entries()) if(n.startsWith(id+"__")) return {name:n.slice(id.length+2), blob:await h.getFile()}; }catch(_){} return null; }
async function loadFromFolder(remote){
  lastFileSave=remote.guardado||""; await idbPut("kv","lastFileSave",lastFileSave);
  S.empresa=remote.empresa||{}; S.portales=remote.portales||{}; COLS.forEach(c=>S[c]=Array.isArray(remote[c])?remote[c]:[]);
  migrar(); localSaved=lastFileSave; await idbPut("kv","data",{...snapshot(), guardado:lastFileSave}); await idbPut("kv","localSaved",localSaved);
  try{ await syncAttachmentsIn(); }catch(_){}
  paintBrand(); render();
}
async function writeDataFile(force){
  if(!dirHandle || syncing) return;
  if(!(await hasPerm())){ fileNeedsPerm=true; paintStatus(); return; }
  syncing=true;
  try{
    const remote=await readFolderData();
    if(!force && remote && remote.guardado && remote.guardado!==lastFileSave && remote.guardado>(lastFileSave||"")){ syncing=false; return syncFromFolder(); }
    const snap=snapshot();
    const fh=await dirHandle.getFileHandle(DATA_NAME,{create:true}); const w=await fh.createWritable(); await w.write(JSON.stringify(snap)); await w.close();
    lastFileSave=snap.guardado; await idbPut("kv","lastFileSave",lastFileSave);
    await syncAttachmentsOut();
    fileNeedsPerm=false;
  }catch(e){ fileNeedsPerm=!(await hasPerm()); if(!fileNeedsPerm) toast("No se pudo escribir en la carpeta de datos: "+(e&&e.message||e)); }
  syncing=false; paintStatus();
}
/* Decide qué datos valen: los de la carpeta (otra PC) o los de este equipo */
async function syncFromFolder(){
  if(!dirHandle || !(await hasPerm()) || syncing) return;
  const remote=await readFolderData();
  const localHas = COLS.some(c=>S[c].length) || !!S.empresa.ruc;
  if(!remote || remote.app!=="control-combustible"){ return writeDataFile(true); }
  const remoteChanged = remote.guardado && remote.guardado!==lastFileSave && remote.guardado>(lastFileSave||"");
  const localChanged = localSaved && localSaved>(lastFileSave||"");
  if(!localHas){ await loadFromFolder(remote); toast("Datos cargados desde la carpeta."); return; }
  if(remoteChanged && !localChanged){ await loadFromFolder(remote); toast("Datos actualizados con los cambios hechos en otra PC."); return; }
  if(remoteChanged && localChanged){
    choiceBox(`La carpeta tiene cambios de otra PC (${new Date(remote.guardado).toLocaleString("es-PE")}) y este equipo también tiene cambios sin subir (${new Date(localSaved).toLocaleString("es-PE")}). ¿Cuáles quieres conservar?`,
      [{t:"Usar los de la carpeta", pri:true, fn:async()=>{ await loadFromFolder(remote); toast("Se cargaron los datos de la carpeta."); }},
       {t:"Usar los de este equipo", fn:async()=>{ await writeDataFile(true); toast("Se guardaron en la carpeta los datos de este equipo."); }}]);
    return;
  }
  if(localChanged) return writeDataFile();
  try{ await syncAttachmentsIn(); }catch(_){}
  paintStatus();
}
async function linkFolder(){
  if(!window.showDirectoryPicker){ toast("Tu navegador no permite elegir una carpeta. Usa Google Chrome o Microsoft Edge."); return; }
  try{
    dirHandle=await showDirectoryPicker({id:"ccc-datos", mode:"readwrite", startIn:"documents"});
    await idbPut("kv","dirHandle",dirHandle); lastFileSave=""; await idbPut("kv","lastFileSave","");
    fileNeedsPerm=false;
    const remote=await readFolderData();
    const localHas = COLS.some(c=>S[c].length) || !!S.empresa.ruc;
    if(remote && remote.app==="control-combustible" && localHas){
      choiceBox(`Esa carpeta ya tiene datos guardados el ${new Date(remote.guardado).toLocaleString("es-PE")}. ¿Qué hacemos?`,
        [{t:"Cargar los datos de la carpeta", pri:true, fn:async()=>{ await loadFromFolder(remote); toast("Datos cargados desde la carpeta."); }},
         {t:"Reemplazarlos con los de este equipo", fn:async()=>{ await writeDataFile(true); toast("Carpeta vinculada y actualizada."); }}]);
    } else if(remote && remote.app==="control-combustible"){ await loadFromFolder(remote); toast("Datos cargados desde la carpeta."); }
    else { await writeDataFile(true); toast("Carpeta vinculada: cada cambio se guardará ahí."); }
    render();
  }catch(e){ if(e&&e.name!=="AbortError") toast("No se pudo vincular la carpeta."); }
}
async function reconnectFile(){ if(!dirHandle) return; try{ if((await dirHandle.requestPermission({mode:"readwrite"}))==="granted"){ fileNeedsPerm=false; await syncFromFolder(); paintStatus(); render(); } }catch(_){ toast("No se pudo reconectar la carpeta."); } }
async function unlinkFile(){ dirHandle=null; fileNeedsPerm=false; await idbDel("kv","dirHandle"); render(); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && !modalOpen){ if(dirHandle) syncFromFolder(); if(typeof syncCloud==="function") syncCloud(false); } });
function paintStatus(){
  const el=$("#dbStatus"); if(!el) return;
  let t="Datos guardados en este equipo.";
  if(cloudOn()) t = cloudState==="sync" ? '<span class="spinner"></span> Sincronizando con tu nube…' : cloudState==="error" ? `<span class="p-bad">No se pudo sincronizar.</span> <a href="#respaldo">Revisar</a>` : cloudState==="offline" ? "Sin internet: los cambios se guardan aquí y se subirán luego." : `${ic("cloud","#4ADE80",14)} Sincronizado con tu nube${lastCloudSave?" · "+new Date(lastCloudSave).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}):""}`;
  else if(dirHandle) t = fileNeedsPerm ? '<button class="btn sm pri" id="recon">Conectar carpeta de datos</button><br>Haz clic para guardar en tu carpeta sincronizada.' : `Sincronizado con la carpeta <b>${esc(dirHandle.name)}</b>${lastFileSave?" · "+new Date(lastFileSave).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}):""}`;
  const ref = [lastBackup, (dirHandle&&!fileNeedsPerm)?lastFileSave:"", cloudOn()?lastCloudSave:""].filter(Boolean).sort().pop()||"";
  const dias = ref ? daysBetween(ref.slice(0,10), today()) : null;
  if(dias===null || dias>7) t+=`<br><a href="#respaldo">${dias===null?"Aún no hay copia de seguridad":"Última copia hace "+dias+" días"}</a>`;
  if(!isStandalone() && (installEvt || isIOS() || location.protocol!=="file:")) t+=`<br><button class="btn sm" id="instBtn" style="margin-top:8px">${ic("install","currentColor",15)}Instalar app</button>`;
  el.innerHTML=t; const b=$("#recon"); b&&b.addEventListener("click",reconnectFile);
  const ib=$("#instBtn"); ib&&ib.addEventListener("click",doInstall);
}
async function fullBackup(conArchivos){
  const out=snapshot();
  if(conArchivos){ out.archivos={}; for(const k of await idbKeys("files")){ const f=await idbGet("files",k); if(!f) continue;
    out.archivos[k]={name:f.name,type:f.type,data:await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f.blob);})}; } }
  return out;
}
function download(name, text, type){ const url=URL.createObjectURL(new Blob([text],{type})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); }
async function restore(obj){
  if(!obj || obj.app!=="control-combustible") throw new Error("El archivo no es una copia de esta app.");
  S.empresa=obj.empresa||{}; S.portales=obj.portales||{}; COLS.forEach(c=>S[c]=Array.isArray(obj[c])?obj[c]:[]);
  migrar();
  if(obj.archivos) for(const [k,f] of Object.entries(obj.archivos)){ const blob=await (await fetch(f.data)).blob(); await idbPut("files",k,{name:f.name,type:f.type,blob,fecha:new Date().toISOString()}); }
  await persist(); paintBrand(); render();
}

function buildAlerts(){
  const out=[];

  S.compras.filter(c=>["Depositada","Facturada","Recibida"].includes(c.estado)).forEach(c=>{ const falt=(c.items||[]).filter(i=>!facturaDe(c.id,i.producto)); if(falt.length && c.estado!=="Depositada") out.push({lvl:"warn", t:`Compra del ${fdate(c.fecha)} a ${esc(provName(c.proveedorId))}: falta factura de ${falt.map(i=>esc(shortProd(i.producto))).join(", ")}.`, go:"#compras"}); });
  S.compras.filter(c=>c.estado==="Cotizada").forEach(c=>{
    const dep = depositosCompra(c.id);
    if(dep < num(c.montoDepositar)-0.01) out.push({lvl:"warn", t:`Compra del ${fdate(c.fecha)} a ${esc(provName(c.proveedorId))}: faltan ${money(num(c.montoDepositar)-dep)} por depositar.`, go:"#compras"});
  });
  S.ventas.filter(v=>v.estado!=="Anulada"&&v.scop&&v.scop.codigo&&v.scop.estado!=="cerrado").forEach(v=>out.push({lvl:"warn", t:`Venta de GLP del ${fdate(v.fecha)} a ${esc((v.cliente&&v.cliente.nombre)||"cliente")}: el SCOP de venta ${esc(v.scop.codigo)} no está cerrado.`, go:"#ventas"}));
  S.ventas.filter(v=>v.estado!=="Anulada"&&v.scop&&!v.scop.codigo).forEach(v=>out.push({lvl:"warn", t:`Venta de GLP del ${fdate(v.fecha)}: falta el código SCOP de venta.`, go:"#ventas"}));
  S.proveedores.forEach(p=>(p.productos||[]).forEach(pr=>{
    if(!num(pr.precio)) out.push({lvl:"warn", t:`Falta el precio referencial de ${esc(pr.nombre)} en ${esc(p.nombre)}.`, go:"#proveedores"});
    else if(pr.actualizado && daysBetween(pr.actualizado, today())>7) out.push({lvl:"warn", t:`Precio de ${esc(pr.nombre)} (${esc(p.nombre)}) sin actualizar desde ${fdate(pr.actualizado)}.`, go:"#proveedores"});

/* ============ Unidades de transporte (propias o de terceros) ============ */
const CIST_DEF=[3000,1500,1000,500];
const PLAN_DEF=["Diésel B5 S-50 UV","Gasohol Regular","Gasohol Premium","Diésel B5 S-50 UV"];
const unidad=id=>S.unidades.find(u=>u.id===id);
const unidadesDe=tipo=>S.unidades.filter(u=>u.activa!==false && (!tipo || u.tipo===tipo));
const capsOf=u=>{ const c=((u&&u.comps)||[]).map(num).filter(x=>x>0); return c.length?c:[0]; };
const llenado=u=>u&&u.tipo==="glp" ? Math.min(100,Math.max(1,num(u.llenadoMax)||85)) : 100;
const usableCaps=u=>capsOf(u).map(c=>Math.floor(c*llenado(u)/100));
const capTotal=u=>capsOf(u).reduce((a,b)=>a+b,0);
const unidadTxt=u=>u?`${u.nombre}${u.placa?" · "+u.placa:""}`:"";
const glpName=()=>knownProducts().find(x=>/glp/.test(norm(x)))||"GLP granel";
const PLANS={liquidos:{unidadId:"",comps:[]}, glp:{unidadId:"",comps:[]}};
/* capacidad para planificar: líquidos en galones; GLP en kilogramos (galones útiles × factor) */
const planCaps=u=> u&&u.tipo==="glp" ? usableCaps(u).map(g=>Math.floor(g*glpF())) : usableCaps(u);
const planU=tipo=> tipo==="glp"?"kg":"gal";
function setPlanUnit(tipo,id){ const P=PLANS[tipo], u=unidad(id); P.unidadId=u?u.id:""; P.comps=u?planCaps(u).map((c,i)=>({prod:tipo==="glp"?glpName():(PLAN_DEF[i]||""), cant:c})):[]; }
function syncPlan(tipo){
  const P=PLANS[tipo]; let u=unidad(P.unidadId);
  if(!u || u.tipo!==tipo || u.activa===false){ setPlanUnit(tipo,(unidadesDe(tipo)[0]||{}).id); u=unidad(P.unidadId); }
  if(!u) return {u:null,caps:[]};
  const caps=planCaps(u); if(P.comps.length!==caps.length) setPlanUnit(tipo,u.id);
  P.comps.forEach((c,i)=>{ if(num(c.cant)>caps[i]) c.cant=caps[i]; if(num(c.cant)<0) c.cant=0; if(tipo==="glp") c.prod=glpName(); });
  return {u,caps};
}
function liqProducts(){ const s=new Set(PRODUCTOS_LIQ); S.proveedores.filter(p=>p.tipo!=="glp").forEach(p=>(p.productos||[]).forEach(x=>{ if(!/glp/.test(norm(x.nombre))) s.add(x.nombre); })); return sortProds([...s]); }
function planTotals(tipo){ const t={}; PLANS[tipo].comps.forEach(c=>{ if(c.prod && num(c.cant)>0) t[c.prod]=(t[c.prod]||0)+num(c.cant); }); return t; }
function findProd(p,name){ const ps=p.productos||[]; let x=ps.find(q=>q.nombre===name); if(x) return x; const k=norm(name); const key=/premium/.test(k)?"premium":/regular/.test(k)?"regular":/diesel/.test(k)?"diesel":/glp/.test(k)?"glp":k; return ps.find(q=>norm(q.nombre).includes(key)); }
/* precio de un producto del proveedor expresado en la unidad pedida (convierte gal↔kg en GLP) */
function precioEn(pr,u){ if(!pr) return 0; const pu=unitOf(pr.nombre,pr.unidad), v=num(pr.precio); if(pu===u||!isGlp(pr.nombre)) return v; return pu==="gal"&&u==="kg" ? v/glpF() : v*glpF(); }
function planLinesFor(p,tipo){ const u=planU(tipo); return Object.entries(planTotals(tipo)).map(([prod,cant])=>{ const pr=p?findProd(p,prod):null, precio=precioEn(pr,u); return {producto:pr?pr.nombre:prod, unidad:u, cantidad:cant, precio, falta:!pr||!precio, actualizado:pr?.actualizado||""}; }); }
const shortProd=n=>{ const k=norm(n); return /premium/.test(k)?"Premium":/regular/.test(k)?"Regular":/diesel/.test(k)?"Diésel":/glp/.test(k)?"GLP":n; };

/* Dibujo de la unidad: cisterna con compartimientos o tanque de GLP */
function tankSvg(u, comps){
  if(!u) return "";
  const caps=capsOf(u), total=caps.reduce((a,b)=>a+b,0)||1, x0=20, x1=600, y0=30, y1=150, isG=u.tipo==="glp"; let x=x0, g="";
  const uid="tc"+Math.random().toString(36).slice(2,7);
  g+=`<rect x="${x0-6}" y="${y0-6}" width="${x1-x0+12}" height="${y1-y0+12}" rx="${isG?66:60}" fill="var(--surface2)" stroke="var(--line)" stroke-width="2"/>`;
  g+=`<clipPath id="${uid}"><rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="${isG?60:54}"/></clipPath><g clip-path="url(#${uid})">`;
  caps.forEach((cap,i)=>{ const w=(x1-x0)*cap/total, c=(comps&&comps[i])||{}, fill=c.prod?pcol(c.prod):"var(--line)", lvl=cap?Math.min(1,(isG?num(c.cant)/glpF():num(c.cant))/cap):0;
    g+=`<rect x="${x.toFixed(1)}" y="${y0}" width="${w.toFixed(1)}" height="${y1-y0}" fill="var(--bg)"/>`;
    if(c.prod && lvl>0) g+=`<rect x="${x.toFixed(1)}" y="${(y1-(y1-y0)*lvl).toFixed(1)}" width="${w.toFixed(1)}" height="${((y1-y0)*lvl).toFixed(1)}" fill="${fill}" opacity=".9"/>`;
    const dark=c.prod&&lvl>0.5;
    g+=`<text x="${(x+w/2).toFixed(1)}" y="${(y0+y1)/2-4}" text-anchor="middle" font-size="${w<90?11:15}" font-weight="700" fill="${dark?"#0E1320":"var(--ink)"}" font-family="var(--f-mono)">${comps?qty(num(c.cant)):qty(cap)}</text>`;
    g+=`<text x="${(x+w/2).toFixed(1)}" y="${(y0+y1)/2+15}" text-anchor="middle" font-size="10.5" fill="${dark?"#0E1320":"var(--muted)"}">${comps?(c.prod?esc(shortProd(c.prod))+(isG?" · kg":""):"vacío"):"gal"}</text>`;
    if(i) g+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${y0}" y2="${y1}" stroke="var(--ink)" stroke-width="3"/>`;
    x+=w; });
  if(isG){ const yl=y1-(y1-y0)*llenado(u)/100; g+=`<line x1="${x0}" x2="${x1}" y1="${yl.toFixed(1)}" y2="${yl.toFixed(1)}" stroke="#FF5C8A" stroke-width="2" stroke-dasharray="7 6"/>`; }
  g+=`</g>`;
  x=x0; caps.forEach((cap,i)=>{ const w=(x1-x0)*cap/total; g+=`<text x="${(x+w/2).toFixed(1)}" y="${y0-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${isG?`Tanque ${qty(cap)} gal · llenado máx. ${llenado(u)}% = ${qty(usableCaps(u)[0])} gal ≈ ${qty(Math.floor(usableCaps(u)[0]*glpF()))} kg`:`C${i+1} · ${qty(cap)} gal`}</text>`; x+=w; });
  g+=`<rect x="${x1+16}" y="${y0+22}" width="58" height="${y1-y0-10}" rx="10" fill="var(--surface2)" stroke="var(--line)" stroke-width="2"/><rect x="${x1+30}" y="${y0+34}" width="34" height="26" rx="4" fill="var(--line)"/>`;
  [80,190,470,560,x1+45].forEach(cx=>{ g+=`<circle cx="${cx}" cy="${y1+18}" r="13" fill="var(--bg)" stroke="var(--muted)" stroke-width="3"/>`; });
  return `<svg viewBox="0 0 700 186" role="img" aria-label="${esc(u.nombre)}: ${caps.length} compartimiento(s), ${qty(total)} galones">${g}</svg>`;
}

const COT = { proveedorId:"", fecha:today(), lines:[], notas:"", modo:"unidad", tipoCarga:"liquidos" };
function tipoCargaDe(p){ if(!p) return "liquidos"; if(p.tipo==="glp") return "glp"; if(p.tipo==="liquidos") return "liquidos"; return COT.tipoCarga==="glp"?"glp":"liquidos"; }
const usaUnidad = p => !!p && COT.modo==="unidad" && unidadesDe(tipoCargaDe(p)).length>0;
function cotCalc(){
  const p = prov(COT.proveedorId), tipo=tipoCargaDe(p);
  const src = usaUnidad(p) ? planLinesFor(p,tipo) : COT.lines;
  const lines = src.map(l=>({...l, importe:r2(num(l.cantidad)*num(l.precio))}));
  const total = r2(lines.reduce((a,l)=>a+l.importe,0));
  const pct = num(p?.percepcionPct);
  const pc = percCot(lines,pct), percepcion = pc.add;
  const sp = p ? saldoProveedor(p.id).saldo : 0;
  const saldo = Math.max(0, sp), deuda = Math.max(0, -sp);
  const aplicar = Math.min(saldo, total+percepcion);
  const depositar = r2(total + percepcion - aplicar + deuda);
  return {p, tipo, lines, total, pct, percepcion, percIncl:pc.incl, saldo, deuda, aplicar, depositar};
}

/* ---- Comparativo de precios ---- */
const CMP={glp:""};
function costoEn(p, lines){
  const ls=lines.map(l=>({...l, importe:r2(num(l.cantidad)*num(l.precio))}));
  const total=r2(ls.reduce((a,l)=>a+l.importe,0)), percepcion=percCot(ls,p.percepcionPct).add;
  const sp=saldoProveedor(p.id).saldo, aplicar=Math.min(Math.max(0,sp), total+percepcion), deuda=Math.max(0,-sp);
  return {p, lines:ls, total, percepcion, sp, aplicar, deuda, depositar:r2(total+percepcion-aplicar+deuda), falta:ls.filter(l=>l.falta).map(l=>l.producto)};
}
function rankHtml(opts, kind, tipo){
  if(!opts.length) return `<div class="empty">No tienes proveedores de ${kind} registrados.</div>`;
  const ok=opts.filter(o=>!o.falta.length && o.total>0).sort((a,b)=>a.total-b.total), bad=opts.filter(o=>o.falta.length || !o.total);
  const best=ok[0], max=Math.max(...ok.map(o=>o.total),1);
  const ahorro = ok.length>1 ? ok.at(-1).total-best.total : 0;
  return `${best&&ok.length>1?`<div class="alert ok"><div>Comprando a <b>${esc(best.p.nombre)}</b> ahorras <b class="mono">${money(ahorro)}</b> frente a la opción más cara.</div></div>`:""}
  <div class="rank">${ok.concat(bad).map(o=>{ const isBest=o===best; return `<div class="opt ${isBest?"best":""}">
    <div class="nm"><div class="row" style="gap:8px"><b>${esc(o.p.nombre)}</b>${isBest?`<span class="pill p-ok">${ok.length>1?"Mejor precio":"Única opción con precio"}</span>`:""}${o.falta.length?`<span class="pill p-bad">Sin precio: ${o.falta.map(esc).join(", ")}</span>`:""}</div>
      <div class="small muted">${o.lines.map(l=>`${shortProd(l.producto)} ${num(l.precio)?`${money4(l.precio)}/${l.unidad}`:"—"}`).join(" · ")}${o.sp>0?` · saldo a favor ${money(o.sp)}`:o.sp<0?` · debes ${money(-o.sp)}`:""}</div>
      ${o.total&&!o.falta.length?`<div class="track"><i style="width:${(o.total/max*100).toFixed(1)}%;background:${isBest?"var(--ok)":"var(--accent)"}"></i></div>`:""}</div>
    <div class="amt"><div class="small muted">Total compra</div><div class="mono" style="font-size:19px;font-weight:700">${o.falta.length?"—":money(o.total)}</div>${!isBest&&best&&!o.falta.length?`<div class="small p-bad">+ ${money(o.total-best.total)}</div>`:""}</div>
    <div class="amt"><div class="small muted">A depositar</div><div class="mono" style="font-size:15px">${o.falta.length?"—":money(o.depositar)}</div><div class="small muted">${o.percepcion?`+ percepción ${money(o.percepcion)}`:"percepción incluida"}</div></div>
    <button class="btn sm ${isBest?"pri":""}" data-buy="${o.p.id}" data-buytipo="${tipo}" ${o.falta.length?"disabled":""}>Comprar aquí</button>
  </div>`; }).join("")}</div>`;
}

  <section class="card"><h3>Precios vigentes con impuestos · líquidos por galón, GLP por kilogramo</h3>${matrix}<div class="small muted">En verde el más barato de cada producto. En GLP se muestra también el precio sin impuestos. "Revisar" indica precios con más de 7 días.</div></section>
  <section class="card"><div class="row between"><h3>Combustibles líquidos: ¿dónde conviene la carga?</h3><span class="small muted">Edita la carga y la comparación se actualiza</span></div>

/* Lectura de archivos: imagen o PDF -> blob JPEG para el lector */
async function fileToImageBlob(file){
  if(file.type==="application/pdf" || /\.pdf$/i.test(file.name)){
    await ensurePdf();
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const page = await pdf.getPage(1);
    const vp0 = page.getViewport({scale:1}); const scale = Math.min(3, 2200/Math.max(vp0.width,vp0.height));
    const vp = page.getViewport({scale});
    const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
    await page.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
    return await new Promise(r=>cv.toBlob(r,"image/jpeg",.88));
  }
  const url=URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k=Math.min(1,2200/Math.max(img.width,img.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(r,"image/jpeg",.88));
  } finally { URL.revokeObjectURL(url); }
}
/* Lectura automática gratuita (OCR Tesseract, en tu equipo). Las librerías se descargan solo cuando se usan. */
function loadScript(src){ return new Promise((res,rej)=>{ if([...document.scripts].some(x=>x.src===src)) return res(); const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=()=>rej({code:"offline"}); document.head.appendChild(sc); }); }
async function ensurePdf(){ if(!window.pdfjsLib) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); }
let ocrWorker=null;
async function ocr(blob){
  if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  if(!ocrWorker) ocrWorker = await Tesseract.createWorker("spa");
  let src=blob;
  try{ /* mejora la imagen para leerla mejor: escala de grises, más contraste y tamaño suficiente */
    const bmp=await createImageBitmap(blob); const k=Math.min(2.5,Math.max(1,1800/Math.max(bmp.width,bmp.height)));
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    const cx=cv.getContext("2d"); cx.drawImage(bmp,0,0,cv.width,cv.height);
    const im=cx.getImageData(0,0,cv.width,cv.height), d=im.data;
    for(let i=0;i<d.length;i+=4){ const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; const c=Math.max(0,Math.min(255,(g-128)*1.45+128)); d[i]=d[i+1]=d[i+2]=c; }
    cx.putImageData(im,0,0); src=await new Promise(r=>cv.toBlob(r,"image/png"));
  }catch(_){ src=blob; }
  const {data} = await ocrWorker.recognize(src||blob);
  return data.text||"";
}
function parseAmount(s){ s=String(s||"").replace(/\s/g,""); if(!s) return 0;
  if(s.includes(",")&&s.includes(".")) s = s.lastIndexOf(",")>s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  else if(/,\d{2}$/.test(s)) s=s.replace(",","."); else s=s.replace(/,/g,"");
  return num(s); }
const AMT="([0-9]{1,3}(?:[.,\\s][0-9]{3})*[.,][0-9]{2}|[0-9]+[.,][0-9]{2})";
function findAmt(T, labels){ for(const l of labels){ const m=T.match(new RegExp("(?:"+l+")[^0-9\\n]{0,30}"+AMT,"i")); if(m) return parseAmount(m[1]); } return 0; }
const MESES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,set:9,sep:9,oct:10,nov:11,dic:12};
function findDate(T, label){
  const src = label ? (T.match(new RegExp("(?:"+label+")[^\\n]{0,40}","i"))||[""])[0] || T : T;
  let m=src.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`; }
  m=src.match(/(\d{1,2})\s*(?:de\s*)?(ene|feb|mar|abr|may|jun|jul|ago|set|sep|oct|nov|dic)[a-z.]*\s*(?:de\s*|del\s*)?(\d{4})/i);
  if(m) return `${m[3]}-${String(MESES[m[2].toLowerCase()]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  return "";
}
function parseDeposito(T){
  const bancos=[[/cr[eé]dito|\bbcp\b/i,"BCP"],[/bbva|continental/i,"BBVA"],[/interbank/i,"Interbank"],[/scotiabank/i,"Scotiabank"],[/naci[oó]n/i,"Banco de la Nación"],[/banbif/i,"BanBif"],[/pichincha/i,"Pichincha"],[/huancayo/i,"Caja Huancayo"]];
  const banco=(bancos.find(([r])=>r.test(T))||[,""])[1];
  const op=(T.match(/(?:n[°ºo.]*\s*(?:de\s*)?operaci[oó]n|nro\.?\s*(?:de\s*)?operaci[oó]n|c[oó]d(?:igo)?\.?\s*(?:de\s*)?operaci[oó]n|operaci[oó]n\s*(?:n[°ºo.]*)?|n[°º]\s*de\s*movimiento|secuencia)\s*[:#]?\s*([0-9]{4,})/i)||[])[1]
        || (T.match(/operaci[oó]n[^0-9\n]{0,25}([0-9]{5,})/i)||[])[1] || "";
  let monto=findAmt(T,["monto\\s*(?:depositado|transferido|total|enviado)?","importe","total","dep[oó]sito"]);
  if(!monto){ const m=T.match(new RegExp("(?:S\\/\\.?|US\\$|\\$)\\s*"+AMT,"i")); if(m) monto=parseAmount(m[1]); }
  const moneda=/US\$|d[oó]lares|\bUSD\b/i.test(T)?"USD":"PEN";
  const hora=(T.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/)||[]).slice(1,3).join(":");
  const cuenta=((T.match(/(?:cuenta|cta\.?|destino|abono|cci)[^0-9\n]{0,30}([0-9][0-9\-\s*]{7,28}[0-9])/i)||[])[1]||"").replace(/\s/g,"");
  const benef=((T.match(/(?:beneficiario|titular|a nombre de|destinatario|empresa)\s*:?\s*([^\n]{3,60})/i)||[])[1]||"").trim();
  const ord=((T.match(/(?:ordenante|remitente|de\s*:|depositante)\s*:?\s*([^\n]{3,60})/i)||[])[1]||"").trim();
  const campos=[banco,op,monto].filter(Boolean).length;
  return {es_comprobante: campos>0 || /operaci[oó]n|dep[oó]sito|transferencia|constancia/i.test(T), legible: !!(op&&monto&&banco), banco, numero_operacion:op, fecha:findDate(T,"fecha"), hora, monto, moneda, cuenta_destino:cuenta, beneficiario:benef, ordenante:ord};
}
function parseFactura(T){
  const rucs=[...new Set((T.match(/\b(?:10|15|17|20)\d{9}\b/g)||[]))];
  const emp=String(S.empresa.ruc||"");
  const emisor=rucs.find(r=>r!==emp)||"";
  const receptor=rucs.find(r=>r===emp)||rucs.find(r=>r!==emisor)||"";
  const sn=T.match(/\b([FE][A-Z0-9]{3})\s*[-–N°º]*\s*0*(\d{1,8})\b/);
  const total=findAmt(T,["importe\\s*total","total\\s*a\\s*pagar","total\\s*(?:de\\s*la\\s*)?venta","precio\\s*total","(?:^|\\n)\\s*total"]);
  const igv=findAmt(T,["i\\.?g\\.?v\\.?(?:\\s*18\\s*%)?","impuesto"]);
  const sub=findAmt(T,["op(?:eraci[oó]n)?\\.?\\s*gravada","valor\\s*(?:de\\s*)?venta","sub\\s*-?\\s*total","total\\s*gravad[ao]"]);
  const per=findAmt(T,["percepci[oó]n"]);
  const conPer=findAmt(T,["total\\s*(?:a\\s*)?(?:pagar|cobrar)","total\\s*con\\s*percepci[oó]n","importe\\s*total\\s*(?:con|incl\\w*)\\s*(?:la\\s*)?percepci[oó]n","monto\\s*total\\s*(?:a\\s*)?(?:pagar|cobrar)"]);
  const k=norm(T); const producto_clave=/premium/.test(k)?"premium":/regular/.test(k)?"regular":/diesel|b5/.test(k)?"diesel":/glp|licuado/.test(k)?"glp":"";
  const gm=T.match(/([0-9]{1,3}(?:[,\s][0-9]{3})*(?:[.,][0-9]{1,3})?|[0-9]+(?:[.,][0-9]{1,3})?)\s*(?:gal(?:ones|on)?\b|GLL|GAL)/i);
  const galones=gm?parseAmount(gm[1]):0;
  const total_facturado = conPer && (!total || conPer>=total) ? conPer : (total? r2(total+per) : 0);
  return {es_factura: !!(sn||/factura/i.test(T)), ruc_emisor:emisor, ruc_receptor:receptor, serie:sn?sn[1]:"", numero:sn?sn[2]:"", fecha_emision:findDate(T,"fecha\\s*(?:de\\s*)?emisi[oó]n")||findDate(T), percepcion:per, total_facturado, galones, producto_clave};
}
async function leerDocumento(blob, tipo){
  if(!navigator.onLine && !window.Tesseract) throw {code:"offline"};
  const T = await ocr(blob);
  return tipo==="deposito" ? parseDeposito(T) : parseFactura(T);
}

function validarDeposito(d, selfId){
  const checks=[];
  const p = prov(d.proveedorId);
  if(!p) checks.push(["bad","Selecciona el proveedor."]);
  if(!(num(d.monto)>0)) checks.push(["bad","El monto debe ser mayor que cero."]);
  if(!d.nroOperacion) checks.push(["bad","Falta el número de operación."]);
  else{
    const dup = S.depositos.find(x=>x.id!==selfId && normOp(x.nroOperacion)===normOp(d.nroOperacion) && (!x.banco||!d.banco||x.banco===d.banco));
    if(dup) checks.push(["bad",`Número de operación duplicado: ya registrado el ${fdate(dup.fecha)} por ${money(dup.monto)}.`]);
    else checks.push(["ok","Número de operación único."]);
  }
  if(!d.fecha) checks.push(["bad","Falta la fecha."]);
  else{
    const dd=daysBetween(d.fecha,today());
    if(dd<0) checks.push(["bad","La fecha del depósito es futura."]);
    else if(dd>45) checks.push(["warn",`El depósito tiene ${dd} días de antigüedad.`]);
    else checks.push(["ok","Fecha coherente."]);
  }
  if(d.compraId){
    const c=S.compras.find(x=>x.id===d.compraId);
    if(c){
      const otros=S.depositos.filter(x=>x.compraId===c.id && x.id!==selfId).reduce((a,x)=>a+num(x.monto),0);
      const falta=r2(num(c.montoDepositar)-otros);
      const dif=r2(num(d.monto)-falta);
      if(Math.abs(dif)<=0.5) checks.push(["ok",`Cubre el monto pendiente de la compra (${money(falta)}).`]);
      else if(dif<0) checks.push(["warn",`Faltarán ${money(-dif)} para completar la compra.`]);
      else checks.push(["warn",`Excede en ${money(dif)} lo calculado; quedará como saldo a favor.`]);
    }
  }
  if(d.moneda==="USD") checks.push(["warn","Depósito en dólares: el saldo se calcula en soles; confirma el tipo de cambio con el proveedor."]);
  return checks;
}

    async function handle(fl){
      file=fl; const st=$("#aiState",m); let blob=null;
      try{ blob=await fileToImageBlob(fl); $("#prev",m).innerHTML=`<img class="preview" alt="Vista previa de la factura" src="${URL.createObjectURL(blob)}">`; }catch(_){ $("#prev",m).innerHTML=`<span class="small">${esc(fl.name)}</span>`; }
      if(!blob){ st.textContent="Completa los campos a mano; el archivo se guardará igual."; return; }
      st.innerHTML='<span class="spinner"></span> Leyendo la factura…';
      try{
        ai=await leerDocumento(blob,"factura");
        if(!ai||ai.es_factura===false){ st.innerHTML='<span class="p-bad">El archivo no parece una factura.</span>'; return; }
        const set=(id,v)=>{ if(v!==undefined&&v!==null&&v!==""&&v!==0) $(id,m).value=v; };
        const hit=S.proveedores.find(p=>p.ruc && String(p.ruc).trim()===String(ai.ruc_emisor||"").trim());
        if(hit && $("#fProv2",m).value!==hit.id){ $("#fProv2",m).value=hit.id; fillComp(); fillProd(); }
        set("#fSer",ai.serie); set("#fNum",ai.numero); set("#fGal",ai.galones?num(ai.galones):""); set("#fFec",ai.fecha_emision);
        set("#fPer",ai.percepcion?num(ai.percepcion).toFixed(2):""); set("#fTot",ai.total_facturado?num(ai.total_facturado).toFixed(2):"");
        if(ai.producto_clave){ const o=[...$("#fProd",m).options].find(o=>o.value && norm(o.value).includes(ai.producto_clave)); if(o){ $("#fProd",m).value=o.value; f.producto=o.value; } }
        let msg = hit?`<span class="p-ok">Datos leídos · proveedor reconocido por RUC.</span>`:`<span class="p-warn">Datos leídos. RUC emisor ${esc(ai.ruc_emisor||"?")} no coincide con ningún proveedor.</span>`;
        if(S.empresa.ruc && ai.ruc_receptor && String(ai.ruc_receptor).trim()!==String(S.empresa.ruc).trim()) msg+=` <span class="p-bad">La factura no está emitida a tu RUC.</span>`;
        st.innerHTML=msg+' Revisa todos los campos.'; check();
      }catch(e){ st.textContent="No se pudo leer la factura; completa los campos a mano."; }
    }
    if(selfId) $("#fDel",m).addEventListener("click",()=>confirmBox("¿Eliminar esta factura?",async()=>{ await remove("facturas",selfId); closeModal(); toast("Factura eliminada."); }));
    $("#fSave",m).addEventListener("click",async e=>{
      const x=read(), ch=check();
      if(!x.proveedorId||!x.serie||!x.numero||!(x.total>0)||!x.producto||!/^\d{4}-\d{2}-\d{2}$/.test(x.fecha)){ toast("Completa proveedor, producto, serie, número, fecha de emisión y total."); return; }
      if(ch.some(([l])=>l==="bad")){ toast(ch.find(([l])=>l==="bad")[1]); return; }
      e.target.disabled=true;
      try{
        let assetId=f.assetId||"";
        if(file){ try{ assetId=await storeFile(file); }catch(_){ toast("No se pudo guardar el archivo; se guardan los datos."); } }
        await save("facturas",selfId||null,{...x, unidad:unidadFac(), incluyePercepcion:true, assetId, creado:f.creado||new Date().toISOString()});
        if(x.compraId){ const c=S.compras.find(k=>k.id===x.compraId); if(c && ["Cotizada","Depositada"].includes(c.estado) && (c.items||[]).every(i=>S.facturas.some(ff=>ff.compraId===c.id&&ff.producto===i.producto))){ try{ await upd("compras",c.id,{estado:"Facturada"}); }catch(_){} } }
        closeModal(); toast("Factura registrada. Saldo actualizado.");
      }catch(_){ e.target.disabled=false; }
    });
  });
}

   ${selfId?"":`<p class="small muted">Se crearán los productos habituales (${esc(PRODUCTOS_LIQ.join(", "))} o ${esc(PRODUCTOS_GLP[0])}); luego ingresa sus precios.</p>`}
   <div class="row between">${selfId?'<button class="btn danger" id="pDel">Eliminar</button>':"<span></span>"}<div class="row"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="pSave">Guardar</button></div></div>`,

      <input class="mono" data-c="${i}" data-k="numero" value="${esc(c.numero)}" placeholder="N.º de cuenta" aria-label="Número de cuenta">
      <input class="mono" data-c="${i}" data-k="cci" value="${esc(c.cci)}" placeholder="CCI" aria-label="CCI">
      <button class="btn sm ghost danger" data-rc="${i}">Quitar</button></div>`).join("")+`<datalist id="bancos2">${BANCOS.map(b=>`<option>${b}</option>`).join("")}</datalist>`;
      $$("[data-c]",m).forEach(el=>el.addEventListener("input",()=>{cuentas[+el.dataset.c][el.dataset.k]=el.value;}));
      $$("[data-c]",m).forEach(el=>el.addEventListener("change",()=>{cuentas[+el.dataset.c][el.dataset.k]=el.value;}));
      $$("[data-rc]",m).forEach(b=>b.addEventListener("click",()=>{cuentas.splice(+b.dataset.rc,1); paint();}));
    };
    paint();
    $("#addCta",m).addEventListener("click",()=>{cuentas.push({banco:"",moneda:"PEN",numero:"",cci:""}); paint();});
    if(selfId) $("#pDel",m).addEventListener("click",()=>{

function modalPrecios(pid){
  const p=prov(pid); if(!p) return;
  let prods=(p.productos||[]).map(x=>({...x, modo:"con"}));
  const pct=num(p.percepcionPct);
  openModal(`<h2>Precios referenciales · ${esc(p.nombre)}</h2><p class="small muted">Solo sirven para cotizar y comparar antes de comprar; no entran en los reportes. Se guardan <b>con impuestos</b> y con 4 decimales. Combustibles líquidos: el precio que da el proveedor (ya incluye sus impuestos). GLP: por kilogramo; puedes escribirlo con impuestos (IGV 18% + percepción ${pct}%) o sin impuestos y la app lo convierte.</p>
   <div class="tablewrap"><table class="lines"><thead><tr><th>Producto</th><th>Unidad</th><th class="n">Precio actual</th><th>Escribo el precio</th><th class="n">Nuevo precio</th><th></th></tr></thead><tbody id="pb"></tbody></table></div>
   <button class="btn sm" id="addPr">+ Agregar producto</button>
   ${(p.historial||[]).length?`<details><summary class="small">Historial de precios (${p.historial.length})</summary><div class="small">${[...p.historial].reverse().slice(0,30).map(h=>`<div>${fdate(h.fecha)} · ${esc(h.producto)}: ${money4(h.anterior)} → <b>${money4(h.precio)}</b></div>`).join("")}</div></details>`:""}
   <div class="row between"><span></span><div class="row"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="prSave">Guardar precios</button></div></div>`,
  m=>{
    const conImp=x=>{ const v=num(x.nuevo); return isGlp(x.nombre)&&x.modo==="sin" ? glpConImp(v,pct) : v; };
    const paint=()=>{ $("#pb",m).innerHTML=prods.map((x,i)=>{ const g=isGlp(x.nombre); return `<tr>
      <td><input data-i="${i}" data-k="nombre" value="${esc(x.nombre)}" aria-label="Producto"></td>
      <td><select data-i="${i}" data-k="unidad" aria-label="Unidad">${["gal","kg","L"].map(u=>`<option ${unitOf(x.nombre,x.unidad)===u?"selected":""}>${u}</option>`).join("")}</select></td>
      <td class="n num">${num(x.precio)?money4(x.precio):"—"}${g&&num(x.precio)?`<div class="small muted">sin imp. ${money4(glpSinImp(x.precio,pct))}</div>`:""}<div class="small muted">${fdate(x.actualizado)}</div></td>
      <td>${g?`<select data-i="${i}" data-k="modo" aria-label="Tipo de precio"><option value="con" ${x.modo!=="sin"?"selected":""}>Con impuestos</option><option value="sin" ${x.modo==="sin"?"selected":""}>Sin impuestos</option></select>`:'<span class="small muted">Con impuestos</span>'}</td>
      <td class="n"><input type="number" step="0.0001" min="0" data-i="${i}" data-k="nuevo" value="${esc(x.nuevo??"")}" placeholder="0.0000" style="width:120px" aria-label="Nuevo precio"><div class="small muted" data-prev="${i}"></div></td>
      <td><button class="btn sm ghost danger" data-rp="${i}" aria-label="Quitar producto">✕</button></td></tr>`; }).join("");
      $$("[data-i]",m).forEach(el=>el.addEventListener("input",()=>{prods[+el.dataset.i][el.dataset.k]=el.value; prevs();}));
      $$("[data-i]",m).forEach(el=>el.addEventListener("change",()=>{prods[+el.dataset.i][el.dataset.k]=el.value; if(el.dataset.k==="nombre"||el.dataset.k==="modo"){ paint(); }}));
      $$("[data-rp]",m).forEach(b=>b.addEventListener("click",()=>{prods.splice(+b.dataset.rp,1); paint();}));
      prevs();
    };
    const prevs=()=>$$("[data-prev]",m).forEach(el=>{ const x=prods[+el.dataset.prev]; el.textContent = isGlp(x.nombre) && x.nuevo!==undefined && x.nuevo!=="" ? (x.modo==="sin" ? `Con impuestos: ${money4(conImp(x))}` : `Sin impuestos: ${money4(glpSinImp(num(x.nuevo),pct))}`) : ""; });
    paint();
    const first=$('[data-k="nuevo"]',m); first&&first.focus();
    $("#addPr",m).addEventListener("click",()=>{prods.push({nombre:"",unidad:"gal",precio:0,actualizado:"",modo:"con"}); paint();});
    $("#prSave",m).addEventListener("click",async e=>{
      const hist=[...(p.historial||[])]; const hoy=today();
      const out=prods.filter(x=>String(x.nombre).trim()).map(x=>{
        const nuevo = x.nuevo!==undefined && x.nuevo!=="" ? Math.round(conImp(x)*10000)/10000 : null;
        const o={nombre:String(x.nombre).trim(), unidad:unitOf(String(x.nombre),x.unidad), precio:num(x.precio), actualizado:x.actualizado||""};
        if(nuevo!==null && nuevo!==num(x.precio)){ hist.push({fecha:hoy, producto:o.nombre, anterior:num(x.precio), precio:nuevo}); o.precio=nuevo; o.actualizado=hoy; }
        else if(nuevo!==null){ o.actualizado=hoy; }
        return o;
      });
      e.target.disabled=true;
      try{
        await upd("proveedores",pid,{productos:out, historial:hist.slice(-200)});
        COT.lines.forEach(l=>{ const pr=out.find(x=>x.nombre===l.producto); if(pr && COT.proveedorId===pid) l.precio=pr.precio; });
        closeModal(); toast("Precios actualizados.");
      }catch(err){ e.target.disabled=false; toast("No se pudieron guardar los precios."); }
    });
  });
}

/* ============ Ventas de GLP (en galones) ============ */
/* Costo por galón de GLP: promedio ponderado de lo FACTURADO en compras de GLP hasta la fecha (con impuestos),
   convirtiendo kg a galones con el factor de Mi empresa. Si aún no hay facturas, usa lo cotizado en las compras. */
function costoGlpGal(hasta){
  let monto=0, gal=0, base="facturas";
  S.facturas.filter(f=>isGlp(f.producto||"") && fechaOk(docFecha(f)) && (!hasta || docFecha(f)<=hasta)).forEach(f=>{
    const c=f.compraId?S.compras.find(k=>k.id===f.compraId):null, it=c?itemDe(c,f.producto):null;
    const q=num(f.galones)?num(f.galones):(it?num(it.cantidad):0), u=num(f.galones)?unitOf(f.producto,f.unidad||(it&&it.unidad)):unitOf(f.producto,it&&it.unidad);
    const g=toGal(q,u); if(g>0){ monto+=facTotal(f); gal+=g; } });
  if(!gal){ base="compras";
    S.compras.filter(c=>c.estado!=="Anulada" && fechaOk(c.fecha) && (!hasta||c.fecha<=hasta)).forEach(c=>(c.items||[]).filter(i=>isGlp(i.producto)).forEach(i=>{ const g=toGal(i.cantidad,unitOf(i.producto,i.unidad)); if(g>0){ monto+=num(i.importe); gal+=g; } })); }
  return gal ? {costo:monto/gal, base, gal} : {costo:0, base:null, gal:0};
}
function stockGlp(hasta){
  const comprado=S.compras.filter(c=>c.estado!=="Anulada" && fechaOk(c.fecha) && (!hasta||c.fecha<=hasta)).reduce((a,c)=>a+(c.items||[]).filter(i=>isGlp(i.producto)).reduce((x,i)=>{ const f=facturaDe(c.id,i.producto); const q=f&&num(f.galones)?toGal(f.galones,unitOf(i.producto,f.unidad||i.unidad)):toGal(i.cantidad,unitOf(i.producto,i.unidad)); return x+q; },0),0);
  const vendido=S.ventas.filter(v=>v.estado!=="Anulada" && fechaOk(v.fecha) && (!hasta||v.fecha<=hasta)).reduce((a,v)=>a+num(v.galones),0);
  return {comprado, vendido, disponible:comprado-vendido};
}
const ventaTotal=v=>r2(num(v.galones)*num(v.precioGal));
const ventaGanancia=v=>r2(num(v.galones)*(num(v.precioGal)-num(v.costoGal)));

  const porCobrar=S.ventas.filter(v=>v.estado!=="Anulada"&&v.cobro!=="cobrado").reduce((a,v)=>a+ventaTotal(v),0);
  const meses=[...new Set(S.ventas.map(v=>String(v.fecha).slice(0,7)).concat([today().slice(0,7)]))].filter(Boolean).sort().reverse();

  return `<div class="head"><div><h2>Ventas de GLP</h2><p>Lo que sale de tu cisterna de GLP, en galones. La ganancia compara el precio de venta con el costo promedio por galón de tus compras de GLP facturadas (con impuestos, convertidas de kg a galones con ${glpF()} kg/gal).</p></div><button class="btn pri" id="nVen">${ic("plus","currentColor",16,2.5)}Registrar venta</button></div>

function filtrosTxt(){
  const f=[];
  if(REP.prov) f.push("Proveedor: "+provName(REP.prov));
  if(REP.prod) f.push("Producto: "+REP.prod);
  if(REP.tipo) f.push("Tipo: "+(REP.tipo==="glp"?"GLP":"Combustibles líquidos"));
  if(REP.unidad) f.push("Unidad: "+(REP.unidad==="sin"?"Sin unidad":unidadTxt(unidad(REP.unidad))||"—"));
  if(REP.prop) f.push("Propiedad: "+(REP.prop==="propia"?"Unidades propias":"Unidades de terceros"));
  if(REP.estado) f.push("Estado: "+REP.estado);
  if(REP.scop) f.push("SCOP: "+{pendiente:"por generar",generado:"generado (abierto)",cerrado:"cerrado"}[REP.scop]);
  if(REP.fact) f.push(REP.fact==="con"?"Solo con factura":"Solo sin factura");
  return f;
}

    <section class="card"><h3>Detalle de ventas de GLP</h3><p class="small muted">Costo por galón = promedio de tus compras de GLP facturadas hasta la fecha de cada venta (con impuestos), convertidas a galones con ${glpF()} kg/gal.</p>${R.ventas.length?tbl(`<th>Fecha</th><th>Cliente</th><th class="n">Galones</th><th class="n">Precio venta</th><th class="n">Total</th><th class="n">Costo/gal</th><th class="n">Ganancia</th><th>SCOP de venta</th><th>Comprobante</th><th>Unidad</th><th>Cobro</th>`,

  else if(vista==="movimientos") body=`<section class="card"><h3>Depósitos del periodo</h3><p class="small muted">${notaBase()}</p>${R.deps.length?tbl(`<th>Fecha</th><th>Proveedor</th><th>Banco</th><th>N° operación</th><th class="n">Monto</th><th>Compra</th><th>Validación</th>`,

      `<tr><td colspan="4"><b>Total</b></td><td class="n"><b>${money(T.dep)}</b></td><td colspan="2"></td></tr>`):'<div class="empty">Sin depósitos.</div>'}</section>

      `<tr><td colspan="5"><b>Total</b></td><td class="n muted"><b>${money(T.perc)}</b></td><td class="n"><b>${money(T.fac)}</b></td><td></td></tr>`):'<div class="empty">Sin facturas.</div>'}</section>`;
  return `<div class="head"><div><h2>Reportes</h2><p>Solo con datos reales: compras, facturas y depósitos. Las cotizaciones y precios referenciales no entran. La percepción se muestra como referencia y ya está incluida en el total facturado.</p></div>
   <div class="row no-print"><button class="btn pri" id="rXlsx">${ic("doc","currentColor",16)}Descargar Excel</button><button class="btn" id="rPrint">Imprimir / PDF</button></div></div>

   </div>
   <div class="row between small"><span class="muted">${filt.length?"Filtros: "+filt.map(esc).join(" · "):"Sin filtros adicionales"}</span>${filt.length?'<button class="btn sm ghost" id="rClear">Quitar filtros</button>':""}</div>

bind.reportes = v=>{
  const set=(k,id)=>$(id,v).addEventListener("change",e=>{ REP[k]=e.target.value; if(k==="desde"||k==="hasta") REP.rango=""; render(); });
  set("desde","#rDes"); set("hasta","#rHas"); set("prov","#rProv"); set("prod","#rProd"); set("tipo","#rTipo"); set("glpU","#rGlpU"); set("unidad","#rUni"); set("prop","#rProp"); set("estado","#rEst"); set("scop","#rScop"); set("fact","#rFact"); set("base","#rBase");
  $$("[data-rng]",v).forEach(b=>b.addEventListener("click",()=>{ setRango(b.dataset.rng); render(); }));
  $$("[data-vista]",v).forEach(b=>b.addEventListener("click",()=>{ REP.vista=b.dataset.vista; render(); }));
  $$("[data-pfac]",v).forEach(tr=>tr.addEventListener("click",()=>modalFactura(S.facturas.find(f=>f.id===tr.dataset.pfac))));
  $$("[data-venta]",v).forEach(tr=>tr.addEventListener("click",()=>modalVenta(S.ventas.find(x=>x.id===tr.dataset.venta))));
  const cl=$("#rClear",v); cl&&cl.addEventListener("click",()=>{ Object.assign(REP,{prov:"",prod:"",tipo:"",unidad:"",prop:"",estado:"",scop:"",fact:""}); render(); });
  $("#rPrint",v).addEventListener("click",()=>window.print());
  bindCompraRows(v);
  $("#rXlsx",v).addEventListener("click",()=>{ try{ const blob=excelReporte(); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`Reporte_compras_${REP.desde}_al_${REP.hasta}.xlsx`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); toast("Excel descargado."); }catch(e){ toast("No se pudo generar el Excel: "+(e.message||e)); } });
};

  const sheets=[{name:"Resumen", rows:res, cols:[40,18,48,18,18], merges:["A1:E1","A2:E2","A3:E3"], heights:{0:24}},

/* ============ Nube propia (Google Apps Script en la cuenta del usuario): PC ↔ celular ============ */
let cloud={url:"",clave:""}, lastCloudSave="", cloudState="off", cloudBusy=false, cloudTimer=null, cloudMsg="";
const cloudOn=()=>!!(cloud.url&&cloud.clave);
async function cloudCall(accion, extra={}){
  const r=await fetch(cloud.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({clave:cloud.clave,accion,...extra}),redirect:"follow"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json(); if(!j.ok && j.error!=="conflicto") throw new Error(j.error==="clave"?"La clave no coincide con la del script.":j.error||"error");
  return j;
}
function blobToB64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); }); }
function b64ToBlob(b64,type){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:type||"application/octet-stream"}); }
async function loadRemote(remote, mark){
  S.empresa=remote.empresa||{}; S.portales=remote.portales||{}; COLS.forEach(c=>S[c]=Array.isArray(remote[c])?remote[c]:[]); migrar();
  lastCloudSave=mark||remote.guardado||""; await idbPut("kv","lastCloudSave",lastCloudSave);
  localSaved=remote.guardado||""; await idbPut("kv","data",{...snapshot(), guardado:localSaved}); await idbPut("kv","localSaved",localSaved);
  paintBrand(); render();
}
async function cloudPush(force){
  const snap=snapshot();
  const j=await cloudCall("guardar",{datos:snap, base:lastCloudSave||null, forzar:!!force});
  if(j.error==="conflicto") return "conflicto";
  lastCloudSave=j.guardado; await idbPut("kv","lastCloudSave",lastCloudSave);
  try{ const {ids}=await cloudCall("listarAdjuntos"); const have=new Set(ids);
    for(const id of await idbKeys("files")){ if(have.has(id)) continue; const f=await idbGet("files",id); if(!f||f.blob.size>20e6) continue;
      await cloudCall("subirAdjunto",{id, nombre:f.name, tipo:f.type||f.blob.type, data:await blobToB64(f.blob)}); }
  }catch(_){ }
  return "ok";
}
async function syncCloud(manual){
  if(!cloudOn() || cloudBusy) return;
  if(!navigator.onLine){ cloudState="offline"; paintStatus(); return; }
  cloudBusy=true; cloudState="sync"; paintStatus();
  try{
    const {guardado:rg}=await cloudCall("meta");
    const localHas = COLS.some(c=>S[c].length) || !!S.empresa.ruc;
    const remoteChanged = rg && rg!==lastCloudSave;
    const localChanged = localSaved && localSaved>(lastCloudSave||"") && localHas;
    if(!rg){ if(localHas) await cloudPush(true); }
    else if(remoteChanged && (!localChanged || !localHas)){ const {datos}=await cloudCall("leer"); if(datos){ await loadRemote(datos, rg); if(manual||localHas) toast("Datos actualizados desde tu nube."); } }
    else if(remoteChanged && localChanged){
      cloudBusy=false;
      choiceBox(`Tu nube tiene cambios hechos en otro equipo (${new Date(rg).toLocaleString("es-PE")}) y este equipo también tiene cambios sin subir. ¿Cuáles conservas?`,
        [{t:"Usar los de la nube", pri:true, fn:async()=>{ const {datos}=await cloudCall("leer"); await loadRemote(datos, rg); toast("Se cargaron los datos de la nube."); }},
         {t:"Usar los de este equipo", fn:async()=>{ await cloudPush(true); toast("Se subieron los datos de este equipo."); paintStatus(); }}]);
      cloudState="ok"; paintStatus(); return;
    }
    else if(localChanged){ const r=await cloudPush(false); if(r==="conflicto"){ cloudBusy=false; return syncCloud(manual); } }
    cloudState="ok"; cloudMsg=""; if(manual) toast("Sincronizado con tu nube.");
  }catch(e){ cloudState="error"; cloudMsg=e.message||String(e); if(manual) toast("No se pudo sincronizar: "+cloudMsg); }
  cloudBusy=false; paintStatus();
}
function scheduleCloud(){ if(!cloudOn()) return; clearTimeout(cloudTimer); cloudTimer=setTimeout(()=>syncCloud(false),2500); }
async function cloudFile(id){
  if(!cloudOn()||!navigator.onLine) return null;
  try{ const j=await cloudCall("bajarAdjunto",{id}); return {name:j.nombre, blob:b64ToBlob(j.data,j.tipo)}; }catch(_){ return null; }
}
async function setCloud(url,clave){
  cloud={url:url.trim(), clave:clave.trim()}; await idbPut("kv","cloud",cloud);
  lastCloudSave=""; await idbPut("kv","lastCloudSave","");
}
window.addEventListener("online",()=>scheduleCloud());
setInterval(()=>{ if(document.visibilityState==="visible" && !modalOpen && !isEditing()) syncCloud(false); }, 90000);
/* Enlace de configuración para el celular: ?nube=URL&clave=... (se borra de la barra al leerlo) */
async function readConfigLink(){
  try{ const q=new URLSearchParams(location.search); const sid=q.get("s"); const u=sid?`https://script.google.com/macros/s/${sid}/exec`:q.get("nube"), k=q.get("k")||q.get("clave");
    if(u&&k&&/^https:\/\/script\.google\.com\//.test(u)){ await setCloud(u,k); history.replaceState(null,"",location.pathname+location.hash); toast("Nube conectada en este equipo. Descargando tus datos…"); return true; }
  }catch(_){}
  return false;
}

  }
  const sid=(cloud.url.match(/\/macros\/s\/([^/]+)\/exec/)||[])[1];
  const link=sid?`${location.origin}${location.pathname}?s=${sid}&k=${encodeURIComponent(cloud.clave)}`:`${location.origin}${location.pathname}?nube=${encodeURIComponent(cloud.url)}&clave=${encodeURIComponent(cloud.clave)}`;
  openModal(`<h2>Conectar el celular</h2><p class="small muted">Apunta la cámara del celular (o Google Lens) a este código; se abrirá la app ya conectada a tu nube. Si la cámara no lo lee, toca <b>Copiar</b>, envíate el enlace por WhatsApp y ábrelo en Chrome. No compartas este código: incluye tu clave.</p>
   <div id="qr" style="background:#fff;padding:14px;border-radius:12px;align-self:center"></div>
   <div class="copyline"><span class="mono small" style="word-break:break-all">${esc(link)}</span><button class="btn sm" id="cpLink">Copiar</button></div>
   <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cerrar</button></div>`, async m=>{
    $("#cpLink",m).addEventListener("click",()=>copy(link));
    try{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"); new QRCode($("#qr",m),{text:link,width:300,height:300,correctLevel:QRCode.CorrectLevel.L}); }
    catch(_){ $("#qr",m).innerHTML='<p style="color:#000;max-width:240px">Sin internet para dibujar el código. Copia el enlace y envíatelo al celular.</p>'; }
  });
}

/* ============ Modal / helpers ============ */
function openModal(html, mount){
  modalOpen=true;
  const root=$("#modalRoot");
  root.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const m=$(".modal",root);
  $$("[data-close]",m).forEach(b=>b.addEventListener("click",closeModal));
  $(".modal-bg",root).addEventListener("mousedown",e=>{ if(e.target.classList.contains("modal-bg")) closeModal(); });
  mount && mount(m);
}
function closeModal(){ $("#modalRoot").innerHTML=""; modalOpen=false; if(pendingRender){ pendingRender=false; } render(); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && modalOpen){ if($("#confirmBg")) $("#confirmBg").remove(); else closeModal(); } });
function confirmBox(msg, onYes){
  const d=document.createElement("div"); d.id="confirmBg"; d.className="modal-bg"; d.style.zIndex=55;
  d.innerHTML=`<div class="modal" style="width:min(420px,100%)"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cNo">Cancelar</button><button class="btn pri" id="cYes">Sí, continuar</button></div></div>`;
  document.body.appendChild(d);
  $("#cNo",d).addEventListener("click",()=>d.remove());
  $("#cYes",d).addEventListener("click",async()=>{ d.remove(); try{ await onYes(); }catch(_){} });
}
function choiceBox(msg, opts){
  const d=document.createElement("div"); d.className="modal-bg"; d.style.zIndex=56;
  d.innerHTML=`<div class="modal" style="width:min(480px,100%)"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end">${opts.map((o,i)=>`<button class="btn ${o.pri?"pri":""}" data-o="${i}">${esc(o.t)}</button>`).join("")}</div></div>`;
  document.body.appendChild(d);
  $$("[data-o]",d).forEach(b=>b.addEventListener("click",async()=>{ d.remove(); try{ await opts[+b.dataset.o].fn(); }catch(_){} }));
}
async function copy(t){ try{ await navigator.clipboard.writeText(t); toast("Copiado."); }catch(_){ toast("No se pudo copiar; selecciona el texto a mano."); } }

/* Nombres de productos: Diésel B5 S-50 → Diésel B5 S-50 UV */
function migrar(){
  const fix=n=> n==="Diésel B5 S-50" ? "Diésel B5 S-50 UV" : n;
  S.proveedores.forEach(p=>{ (p.productos||[]).forEach(x=>x.nombre=fix(x.nombre)); (p.historial||[]).forEach(h=>h.producto=fix(h.producto)); });
  S.compras.forEach(c=>(c.items||[]).forEach(i=>i.producto=fix(i.producto)));
  if(!Array.isArray(S.unidades)) S.unidades=[];
  let cambio=false;
  if(!S.empresa.unidadesMigradas){
    const ci=S.empresa.cisterna||{}, comps=(ci.comps||[]).map(num).filter(x=>x>0);
    const usabaCisterna = !!S.empresa.cisterna || S.compras.some(c=>Array.isArray(c.carga));
    if(!S.unidades.length && usabaCisterna) S.unidades.push({id:genId(), nombre:"Cisterna de combustibles líquidos", tipo:"liquidos", propiedad:"tercero", placa:ci.placa||"", placaTracto:"", transportista:{razon:"",ruc:"",telefono:""}, conductor:"", licencia:"", comps:comps.length?comps:[3000,1500,1000,500], llenadoMax:100, activa:true, notas:"Creada automáticamente desde la cisterna anterior. Completa los datos del transportista.", creado:new Date().toISOString()});
    S.empresa.unidadesMigradas=true; cambio=true;
  }
  /* v5: SCOP y factura por producto; total facturado incluye percepción; códigos SCOP de la empresa */
  S.compras.forEach(c=>{ if(!Array.isArray(c.scops)){ c.scops=scopsOf(c); c.placa=placaOf(c); c.conductor=conductorOf(c); if(c.scop&&c.scop.transportista&&c.tipo==="glp") c.scopTransportista=c.scop.transportista; delete c.scop; cambio=true; } });
  S.facturas.forEach(f=>{ if(!f.incluyePercepcion){ f.total=r2(num(f.total)+num(f.percepcion)); f.incluyePercepcion=true; cambio=true; }
    if(!f.producto && f.compraId){ const c=S.compras.find(x=>x.id===f.compraId); if(c && (c.items||[]).length===1){ f.producto=c.items[0].producto; if(!num(f.galones)) f.galones=num(c.items[0].cantidad); cambio=true; } } });
  if(!S.empresa.glpKgV6){ const f=glpF();
    S.proveedores.forEach(p=>(p.productos||[]).forEach(x=>{ if(isGlp(x.nombre) && (x.unidad||"gal")!=="kg"){ x.precio=num(x.precio)?Math.round(num(x.precio)/f*10000)/10000:0; x.unidad="kg"; x.actualizado=""; } }));
    S.empresa.glpKgV6=true; cambio=true; }
  if(!S.empresa.glpPrecioV7){
    S.proveedores.forEach(p=>{ const f=1+num(p.percepcionPct)/100; (p.productos||[]).forEach(x=>{ if(isGlp(x.nombre)&&num(x.precio)) x.precio=Math.round(num(x.precio)*f*10000)/10000; }); (p.historial||[]).forEach(h=>{ if(isGlp(h.producto)){ h.anterior=Math.round(num(h.anterior)*f*10000)/10000; h.precio=Math.round(num(h.precio)*f*10000)/10000; } }); });
    S.empresa.glpPrecioV7=true; cambio=true; }
  if(!S.empresa.codigosV5){ ["usuarioScop","registroGLP","usuarioScopGLP"].forEach(k=>{ if(!S.empresa[k]) S.empresa[k]=DEF_EMP[k]; }); S.empresa.codigosV5=true; cambio=true; }
  return cambio;
}
/* ============ Inicio ============ */
render();
(async()=>{
  try{
    idb=await openIDB();
    const d=await idbGet("kv","data");
    if(!d){ Object.assign(S.empresa,{unidadesMigradas:true, glpKgV6:true, glpPrecioV7:true}); }
    if(d){ S.empresa=d.empresa||{}; S.portales=d.portales||{}; COLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[]); if(migrar()) setTimeout(()=>persist().catch(()=>{}),0); }
    lastBackup=(await idbGet("kv","lastBackup"))||"";
    dirHandle=(await idbGet("kv","dirHandle"))||null;
    lastFileSave=(await idbGet("kv","lastFileSave"))||""; localSaved=(await idbGet("kv","localSaved"))||"";
    if(dirHandle){ fileNeedsPerm=!(await hasPerm()); if(!fileNeedsPerm) syncFromFolder(); }
    cloud=(await idbGet("kv","cloud"))||{url:"",clave:""}; lastCloudSave=(await idbGet("kv","lastCloudSave"))||"";
    await readConfigLink();
    if(cloudOn()) syncCloud(false);
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    paintBrand(); render(); paintStatus();
  }catch(e){ $("#dbStatus").textContent="Este navegador no permite guardar datos (¿modo incógnito?). Usa Chrome o Edge normal."; }
})();
